name: drive-clean
# Manual button: remember processed songs in Drive/state/songs.md, then empty Drive/done and remove empty Drive/ready folders.
# Songs waiting in Drive/audio and unsent drafts in Drive/ready are never deleted. Deleted files go to the Drive trash (~30 days).
on:
  workflow_dispatch:
    inputs:
      remove:
        description: "optional: exact file name in Drive/audio to delete (goes to the Drive trash), e.g. Guf - Uragan.mp3"
        default: ""
concurrency:
  group: generate   # never clean while videos are being made
  cancel-in-progress: false
env:
  RCLONE_CONFIG_GD_TYPE: drive
  RCLONE_CONFIG_GD_SCOPE: drive
  RCLONE_CONFIG_GD_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
  RCLONE_CONFIG_GD_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
  RCLONE_CONFIG_GD_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y rclone
      - run: pip install -r requirements.txt
      - name: Drive token
        env:
          RT: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          echo "::add-mask::$RT"
          python -c "import json,os;print('RCLONE_CONFIG_GD_TOKEN='+json.dumps({'access_token':'','token_type':'Bearer','refresh_token':os.environ['RT'],'expiry':'2000-01-01T00:00:00Z'}))" >> "$GITHUB_ENV"
      - name: Clean
        env:
          REMOVE: ${{ inputs.remove }}
        run: FORCE=1 bash scripts/drive_clean.sh
