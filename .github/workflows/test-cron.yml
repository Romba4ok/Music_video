name: Test Cron

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check schedule
        run: |
          echo "Scheduled run works!"
          date -u
          echo "Event: $GITHUB_EVENT_NAME"
