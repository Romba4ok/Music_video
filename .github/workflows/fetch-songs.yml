name: fetch-songs
# First job of every generate run (workflow_call) and a manual button: tops Drive/audio up to `target` songs (default 3), then generate makes the videos.
# Songs: only queue.md and the Russian part of the KZ chart, each searched in sources that allow download (CC0 / public domain / CC-BY; see docs/rights.md).
# Songs with no licensed full recording are skipped and remembered (Drive/state/songs.md). No DRM or paywall is bypassed, nothing is ripped from YouTube/streaming.
on:
  workflow_call:
    inputs:
      target:
        type: string
        default: "3"
  workflow_dispatch:
    inputs:
      target:
        description: how many songs should be in Drive/audio after this run
        default: "3"
concurrency:
  group: fetch-songs
  cancel-in-progress: false
env:
  RCLONE_CONFIG_GD_TYPE: drive
  RCLONE_CONFIG_GD_SCOPE: drive
  RCLONE_CONFIG_GD_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
  RCLONE_CONFIG_GD_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
  RCLONE_CONFIG_GD_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg rclone
      - run: pip install -r requirements.txt
      - name: Drive token
        env:
          RT: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          echo "::add-mask::$RT"
          python -c "import json,os;print('RCLONE_CONFIG_GD_TOKEN='+json.dumps({'access_token':'','token_type':'Bearer','refresh_token':os.environ['RT'],'expiry':'2000-01-01T00:00:00Z'}))" >> "$GITHUB_ENV"
      - name: Memory, queue and what Drive already has
        shell: bash   # a Drive error stops the step; "no file yet" is accepted only when the listing really lacks it
        run: |
          mkdir -p out
          ROOT_LS=$(rclone lsf gd:)   # fails the step on a real Drive error, so a missing memory below can only mean "first run"
          { rclone lsf gd:audio; rclone lsf gd:done; } | grep -v '/$' > out/have.txt || true
          if echo "$ROOT_LS" | grep -qx 'state/' && rclone lsf gd:state | grep -qx 'songs.md'; then rclone copyto gd:state/songs.md out/songs-memory.md
          else echo "no memory in Drive yet: starting from the repo seed"; cp accounts/main/songs-memory.md out/songs-memory.md; fi
          if echo "$ROOT_LS" | grep -qx 'queue.txt'; then rclone copyto gd:queue.txt accounts/main/queue.md; else echo "no Drive queue.txt: repo queue.md is used"; fi
      - name: Remove earlier downloads that do not fit (not Russian, not your artists)
        shell: bash
        run: |
          python -m pipeline songs --state out/songs-memory.md --prune out/prune.txt
          while read -r f; do
            if [ -n "$f" ] && grep -qxF "$f" out/have.txt; then rclone deletefile "gd:audio/$f" && echo "removed from Drive/audio: $f" | tee -a "$GITHUB_STEP_SUMMARY"; fi   # goes to the Drive trash
          done < out/prune.txt
      - name: Search and download (allowed sources only)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
        run: |
          TARGET="${{ inputs.target || '3' }}"
          HAVE=$(rclone lsf gd:audio | grep -ciE '\.(mp3|wav|m4a|ogg|flac|mp4|mov|mkv|webm|m4v)$' || true)
          NEED=$(( TARGET - HAVE )); [ "$NEED" -lt 0 ] && NEED=0
          echo "Songs in Drive/audio: $HAVE, target $TARGET, downloading up to $NEED" | tee -a "$GITHUB_STEP_SUMMARY"
          python -m pipeline songs --out out/fetched --have-file out/have.txt --state out/songs-memory.md --max "$NEED"   # no --discover: only songs from queue.md / the Russian chart, never random open-license tracks | tee out/songs.json
      - name: Upload to Drive/audio, then save the memory
        shell: bash
        run: |
          if [ -n "$(ls -A out/fetched 2>/dev/null)" ]; then rclone copy out/fetched gd:audio; fi
          rclone copyto out/songs-memory.md gd:state/songs.md   # after the audio upload: a failed upload is retried tomorrow
          tail -n 1 out/songs.json | python -c "import json,sys;r=json.load(sys.stdin);print('Downloaded today: %d of %d searched; skipped in memory: %d' % (len(r['downloaded']), r['tried'], r['skipped_total']));[print('- '+f) for f in r['downloaded']]" >> "$GITHUB_STEP_SUMMARY"
          echo "Memory: Drive/state/songs.md" >> "$GITHUB_STEP_SUMMARY"
          { echo "Drive/audio now:"; rclone lsf gd:audio | grep -v '\.license\.json$' | sed 's/^/- /'; } | tee -a "$GITHUB_STEP_SUMMARY"
