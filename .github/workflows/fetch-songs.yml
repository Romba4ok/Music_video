name: fetch-songs
# Daily search (schedule), a manual button and an optional first step of generate (search=true): tops Drive/audio up to `target` songs (default 3), then generate makes the videos.
# Songs: only queue.md and the Russian part of the KZ chart, each searched in sources that allow download (CC0 / public domain / CC-BY; see docs/rights.md).
# A queue.md song without a licensed file gets its official 30 s preview (Apple/Deezer) for lyric timing only: such a video is made in mode tiktok, the sound is added in TikTok.
# Songs with no licensed full recording are skipped and remembered (Drive/state/songs.md). No DRM or paywall is bypassed, nothing is ripped from YouTube/streaming.
on:
  schedule:
    - cron: "0 1 * * *"   # daily search, 06:00 Almaty: separate from generate, which only uses what is already in Drive/audio
  workflow_call:
    inputs:
      target:
        type: string
        default: "3"
      force_retry:
        description: "search ALL skipped songs again now (ignores the 14-day wait and the search signature)"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      target:
        description: how many songs should be in Drive/audio after this run
        default: "3"
      force_retry:
        description: "search ALL skipped songs again now (ignores the 14-day wait and the search signature)"
        default: false
concurrency:
  group: fetch-songs
  cancel-in-progress: false
env:
  RCLONE_CONFIG_GD_TYPE: drive
  RCLONE_CONFIG_GD_SCOPE: drive
  RCLONE_CONFIG_GD_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
  RCLONE_CONFIG_GD_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
  RCLONE_CONFIG_GD_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
jobs:
  fetch:
    concurrency:   # one writer of Drive/audio and Drive/state at a time (search, generate, selftest share this queue): no lost updates, no double download
      group: vybex-drive
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg rclone
      - run: pip install -r requirements.txt
      - name: Drive token
        env:
          RT: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          echo "::add-mask::$RT"
          python -c "import json,os;print('RCLONE_CONFIG_GD_TOKEN='+json.dumps({'access_token':'','token_type':'Bearer','refresh_token':os.environ['RT'],'expiry':'2000-01-01T00:00:00Z'}))" >> "$GITHUB_ENV"
      - name: Memory, queue and what Drive already has
        shell: bash   # a Drive error stops the step; "no file yet" is accepted only when the listing really lacks it
        run: |
          mkdir -p out
          ROOT_LS=$(rclone lsf gd:)   # fails the step on a real Drive error, so a missing memory below can only mean "first run"
          { rclone lsf gd:audio; rclone lsf gd:done; } | grep -v '/$' > out/have.txt || true
          if echo "$ROOT_LS" | grep -qx 'state/' && rclone lsf gd:state | grep -qx 'songs.md'; then rclone copyto gd:state/songs.md out/songs-memory.md
          else echo "no memory in Drive yet: starting from the repo seed"; cp accounts/main/songs-memory.md out/songs-memory.md; fi
          if echo "$ROOT_LS" | grep -qx 'state/' && rclone lsf gd:state | grep -qx 'song-links.md'; then rclone copyto gd:state/song-links.md out/song-links.md; fi
          if echo "$ROOT_LS" | grep -qx 'state/' && rclone lsf gd:state | grep -qx 'musicbrainz-cache.json'; then rclone copyto gd:state/musicbrainz-cache.json out/musicbrainz-cache.json; fi
          if echo "$ROOT_LS" | grep -qx 'queue.txt'; then rclone copyto gd:queue.txt accounts/main/queue.md; else echo "no Drive queue.txt: repo queue.md is used"; fi
      - name: Remove earlier downloads that do not fit (not Russian, not your artists)
        shell: bash
        run: |
          python -m pipeline songs --state out/songs-memory.md --prune out/prune.txt
          while read -r f; do
            if [ -n "$f" ] && grep -qxF "$f" out/have.txt; then rclone deletefile "gd:audio/$f" && echo "removed from Drive/audio: $f" | tee -a "$GITHUB_STEP_SUMMARY"; fi   # goes to the Drive trash
          done < out/prune.txt
      - name: Probe every source with one test query
        continue-on-error: true
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
        run: |
          { echo '### Source probe (query "piano")'; echo '```'; python -m pipeline.sources --probe piano; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Search and download (allowed sources only)
        env:
          AUDIO_PROXY_URL: ${{ secrets.AUDIO_PROXY_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          MUSICBRAINZ_CONTACT: ${{ vars.MUSICBRAINZ_CONTACT }}   # your address or project URL (repository variable); empty = MusicBrainz gets plain "VYBEX/1.0"
        run: |
          TARGET="${{ inputs.target || '3' }}"
          HAVE=$(rclone lsf gd:audio | grep -ciE '\.(mp3|wav|m4a|ogg|flac|mp4|mov|mkv|webm|m4v)$' || true)
          NEED=$(( TARGET - HAVE )); [ "$NEED" -lt 0 ] && NEED=0
          echo "Songs in Drive/audio: $HAVE, target $TARGET, downloading up to $NEED" | tee -a "$GITHUB_STEP_SUMMARY"
          # no --discover and no --previews: only songs of queue.md / the Russian chart that a source really allows to download (a video needs real sound)
          FORCE=""; if [ "${{ inputs.force_retry }}" = "true" ]; then FORCE="--force-retry"; fi
          python -m pipeline songs --download-only --out out/fetched --have-file out/have.txt --state out/songs-memory.md --max "$NEED" $FORCE | tee out/songs.json
      - name: Upload to Drive/audio, then save the memory
        shell: bash
        run: |
          QUEUE_UPDATE=$(tail -n 1 out/songs.json | python -c "import json,sys;print(json.load(sys.stdin).get('queue_update_file') or '')")
          if [ -n "$QUEUE_UPDATE" ]; then rclone copyto "$QUEUE_UPDATE" gd:queue.txt; fi
          if [ -n "$(ls -A out/fetched 2>/dev/null)" ]; then rclone copy out/fetched gd:audio; fi
          if [ -f out/song-links.md ]; then rclone copyto out/song-links.md gd:state/song-links.md; fi   # pages of songs found on the artists' own sites (no file to download)
          if [ -f out/musicbrainz-cache.json ]; then rclone copyto out/musicbrainz-cache.json gd:state/musicbrainz-cache.json; fi   # answers of MusicBrainz (30 days): the same release is never asked twice
          rclone copyto out/songs-memory.md gd:state/songs.md   # after the audio upload: a failed upload is retried tomorrow
          tail -n 1 out/songs.json | python -c "import json,sys;r=json.load(sys.stdin);print('Candidates %d (eligible %d, blocked by a recent identical search %d); checked %d (of them re-checked skipped: %d), not reached %d; downloaded %d; skipped in memory %d; force-retry %s' % (r['candidates'], r['eligible'], r['blocked_recent'], r['checked'], r['rechecked_skipped'], r['left_unchecked'], len(r['downloaded']), r['skipped_total'], r['force_retry'])); print('Skip reasons:', r['skip_reasons'] or '-'); print('MusicBrainz contact:', 'configured' if r.get('musicbrainz_contact') else 'NOT configured (set the repository variable MUSICBRAINZ_CONTACT)'); print('Source answers:', r['source_states'] or '-'); [print('Source %s: queries %d, candidates %d, license allowed %d, matched the song %d, downloaded %d' % (n, v['queries'], v['candidates'], v['allowed'], v['matched'], v['downloaded'])) for n, v in r.get('sources', {}).items()]; [print('- '+f) for f in r['downloaded']]; print('Per song:'); [print('- %s: %s %s %s' % (s['song'], s['result'], s['file'] or s['reason'][:220], ' '.join(s['links'][:2]))) for s in r.get('songs', [])]" >> "$GITHUB_STEP_SUMMARY"
          echo "Memory: Drive/state/songs.md" >> "$GITHUB_STEP_SUMMARY"
          { echo "Drive/audio now:"; { rclone lsf gd:audio | grep -v '\.license\.json$' || true; } | sed 's/^/- /'; } | tee -a "$GITHUB_STEP_SUMMARY"
          rclone lsjson gd:audio --files-only --max-depth 1 > out/drive-audio.json
          rclone copy gd:audio out/drive-metadata --max-depth 1 --include '*.license.json'
          python -m pipeline.audio_inventory out/drive-audio.json out/drive-metadata | tee -a "$GITHUB_STEP_SUMMARY"
