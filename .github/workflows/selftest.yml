name: selftest
# Manual integration-test helper for generate.yml. NEVER runs by itself.
#   put   : makes ONE synthetic Russian "song" (espeak-ng, our own sound: no third-party rights at all), puts it into Drive/audio and a TEMPORARY Drive/queue.txt
#           (= your queue.md unchanged + one test line on top, marked <!-- vybex-selftest -->). Refuses to run if Drive/queue.txt or any audio already exists (your data).
#   clean : removes ONLY what `put` created: the test audio (+ sidecar) in audio/ done/, queue.txt when it carries the marker, the test row in state/songs.md,
#           ready/<date>/ when it did not exist before `put`. Everything goes to the Drive trash (recoverable ~30 days).
# Then run generate.yml with buffer=plan (nothing is created in Buffer / TikTok).
on:
  workflow_dispatch:
    inputs:
      action:
        description: put | clean
        default: put
concurrency:
  group: vybex-drive
  cancel-in-progress: false
env:
  RCLONE_CONFIG_GD_TYPE: drive
  RCLONE_CONFIG_GD_SCOPE: drive
  RCLONE_CONFIG_GD_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
  RCLONE_CONFIG_GD_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
  RCLONE_CONFIG_GD_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
  NAME: "VYBEX Selftest - Тест.mp3"
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y rclone ffmpeg espeak-ng && pip install requests
      - name: Drive token
        env:
          RT: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          echo "::add-mask::$RT"
          python -c "import json,os;print('RCLONE_CONFIG_GD_TOKEN='+json.dumps({'access_token':'','token_type':'Bearer','refresh_token':os.environ['RT'],'expiry':'2000-01-01T00:00:00Z'}))" >> "$GITHUB_ENV"
      - name: put - one synthetic test song into Drive/audio
        if: ${{ (github.event.inputs.action || 'put') == 'put' }}
        shell: bash
        run: |
          ROOT_LS=$(rclone lsf gd:)
          # a repeated put may replace ITS OWN files (marker in queue.txt, only the test song in audio/); anything else is your data
          if echo "$ROOT_LS" | grep -qx 'queue.txt'; then
            rclone copyto gd:queue.txt prev-queue.txt
            if ! head -n1 prev-queue.txt | grep -qF 'vybex-selftest'; then echo "Drive/queue.txt exists (your data): refusing to overwrite it"; exit 1; fi
          fi
          if [ -n "$(rclone lsf gd:audio | grep -v '/$' | grep -vxF -e "$NAME" -e "$NAME.license.json" || true)" ]; then echo "Drive/audio holds other files (your data): refusing to mix a test into it"; exit 1; fi
          D=$(date -u +%F)
          if rclone lsf gd:state | grep -qx 'selftest.json'; then rclone copyto gd:state/selftest.json selftest.json; else
          { echo "{\"date\": \"$D\", \"ready_before\": ["; { rclone lsf gd:ready 2>/dev/null || true; } | sed 's/.*/"&"/' | paste -sd, -; echo "]}"; } > selftest.json; fi
          cat selftest.json
          # a "song" of 4 verses and a hook that changes a little each time (Whisper drops word-for-word repeats), spoken slowly, ~90 s
          cat > lyrics.txt <<'TXT'
          Я иду по городу ночью. Огни зовут меня домой. Каждый шаг становится громче. Я не потерялся, я живой.
          Мы не сдаёмся, мы идём вперёд. Свет впереди, свет впереди.
          Дорога длинная, но я не один. Рядом со мной мои друзья. Каждый день это новый шанс. Я знаю, что это моя судьба.
          Мы не сдаёмся, и ночь пройдёт. Свет впереди, только иди.
          Пусть ветер холодный, пусть путь непростой. Я помню, зачем я иду. Внутри меня светит огонь, и он ведёт меня к мечте.
          Мы не сдаёмся, мы верим в мечту. Свет впереди, ведёт нас домой.
          Утро приходит, и город проснулся. Новые люди, новые дни. Я улыбаюсь, ведь всё получилось. Спасибо за то, что вы были со мной.
          Мы не сдаёмся, и ночь позади. Свет впереди, свет мой и твой.
          TXT
          sed -i 's/^ *//' lyrics.txt
          espeak-ng -v ru -s 125 -g 8 -f lyrics.txt -w speech.wav
          ffmpeg -y -v error -f lavfi -i "sine=frequency=60:beep_factor=2:duration=140" -i speech.wav -filter_complex "[0:a]volume=0.08[b];[1:a][b]amix=inputs=2:duration=first:normalize=0[m];[m]acompressor=threshold=0.03:ratio=10:attack=5:release=80:makeup=8,loudnorm=I=-13:TP=-1.5:LRA=5[o]" -map "[o]" -ar 44100 -b:a 192k "$NAME"
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$NAME"); echo "test song: $NAME, ${DUR}s"
          printf '{"license": "cc0", "attribution": "synthetic test audio generated by VYBEX selftest (espeak-ng)", "source": "selftest", "rights": "own"}' > "$NAME.license.json"
          { echo '<!-- vybex-selftest -->'; echo 'VYBEX Selftest | Тест | | '; cat accounts/main/queue.md; } > queue.txt
          rclone copyto "$NAME" "gd:audio/$NAME"; rclone copyto "$NAME.license.json" "gd:audio/$NAME.license.json"
          rclone copyto queue.txt gd:queue.txt
          mkdir -p out && rclone lsf gd: > /dev/null && { rclone mkdir gd:state; rclone copyto selftest.json gd:state/selftest.json; }
          echo "put done: Drive/audio has the test song, Drive/queue.txt is the temporary queue (your list + 1 test line). Now run generate.yml with buffer=plan." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: clean - remove only what put created
        if: ${{ github.event.inputs.action == 'clean' }}
        shell: bash
        run: |
          D=$(date -u +%F)
          for p in audio done; do
            for f in "$NAME" "$NAME.license.json"; do
              if rclone lsf "gd:$p" | grep -qxF "$f"; then rclone deletefile "gd:$p/$f" && echo "deleted gd:$p/$f"; fi
            done
          done
          if rclone lsf gd: | grep -qx 'queue.txt'; then
            rclone copyto gd:queue.txt queue.txt
            if head -n1 queue.txt | grep -qF 'vybex-selftest'; then rclone deletefile gd:queue.txt && echo "deleted gd:queue.txt (temporary test queue)"; else echo "gd:queue.txt has no selftest marker: NOT touched"; fi
          fi
          if rclone lsf gd:state | grep -qx 'selftest.json'; then
            rclone copyto gd:state/selftest.json selftest.json
            DAY=$(python -c "import json;print(json.load(open('selftest.json'))['date'])")
            if python -c "import json,sys;sys.exit(0 if '$DAY/' in json.load(open('selftest.json'))['ready_before'] else 1)"; then echo "gd:ready/$DAY existed before the test: NOT touched"
            elif rclone lsf gd:ready | grep -qx "$DAY/"; then rclone purge "gd:ready/$DAY" && echo "deleted gd:ready/$DAY (created by the test)"; fi
            rclone deletefile gd:state/selftest.json
          fi
          if rclone lsf gd:state | grep -qx 'songs.md'; then
            rclone copyto gd:state/songs.md out-songs.md
            python - <<'PY'
          from pipeline.fetch_songs import key, load_memory, save_memory
          st = load_memory("out-songs.md")
          k = key("VYBEX Selftest", "Тест")
          n = sum(1 for t in ("done", "skipped") if st[t].pop(k, None))
          save_memory("out-songs.md", st)
          print("test rows removed from songs.md:", n)
          PY
            rclone copyto out-songs.md gd:state/songs.md
          fi
          { echo "clean done. Drive now:"; for d in audio done ready state; do echo "- $d/: $(rclone lsf "gd:$d" 2>/dev/null | grep -v '/$' | wc -l) files"; done; rclone lsf gd: | sed 's/^/  root: /'; } | tee -a "$GITHUB_STEP_SUMMARY"
