name: generate
# Google Drive in/out. UNTESTED on GitHub Actions (cannot be run locally): first run via "Run workflow", read the log, then rely on cron.
# Drive folder (its ID = secret GDRIVE_FOLDER_ID):  audio/ (you drop songs)  ready/<date>/ (results)  done/ (processed songs)  queue.txt (optional)
# No "push" trigger: a code push must never generate videos or put posts into the TikTok queue.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: auto (mp4 with sound) or tiktok (silent mp4 + sync file)
        default: auto
      count:
        description: how many videos (scheduled runs use repo variable VYBEX_POSTS_PER_DAY, default 3)
        default: ""
      buffer:
        description: "Buffer mode for this run only: plan (checks, creates nothing) | draft | queue | now (publish immediately) | off. Empty = repo variable VYBEX_BUFFER, else now"
        default: ""
# Two triggers can fire on the same morning (GitHub cron + an external pinger via workflow_dispatch): never run two at once, the second waits.
concurrency:
  group: generate
  cancel-in-progress: false
env:
  HYPERFRAMES_NO_UPDATE_CHECK: "1"
  HYPERFRAMES_SKIP_SKILLS: "1"
  RCLONE_CONFIG_GD_TYPE: drive
  RCLONE_CONFIG_GD_SCOPE: drive
  RCLONE_CONFIG_GD_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
  RCLONE_CONFIG_GD_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
  RCLONE_CONFIG_GD_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
  VYBEX_OWNER_DECLARES_RIGHTS: "1"  # files you put in Drive/audio = your declaration that you may use them
jobs:
  # Step 1: top Drive/audio up to 3 songs (queue, Russian chart songs, open Russian tracks). Step 2 below needs whatever is there, even if this step found nothing.
  fetch:
    uses: ./.github/workflows/fetch-songs.yml
    with:
      target: "3"
    secrets: inherit
  generate:
    needs: fetch
    if: ${{ !cancelled() }}  # a failed or empty download must not stop the videos
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg rclone
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - run: npm ci
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-large-v3  # small finds the window, large-v3 re-reads only that window
      - name: Drive token
        env:
          RT: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          echo "::add-mask::$RT"
          python -c "import json,os;print('RCLONE_CONFIG_GD_TOKEN='+json.dumps({'access_token':'','token_type':'Bearer','refresh_token':os.environ['RT'],'expiry':'2000-01-01T00:00:00Z'}))" >> "$GITHUB_ENV"
      - name: Pull songs from Drive
        run: |
          mkdir -p accounts/main/audio
          rclone copy gd:audio accounts/main/audio --progress=false
          rclone copyto gd:queue.txt accounts/main/queue.md 2>/dev/null || echo "no queue.txt (fine)"
          ls accounts/main/audio
      - name: Claude CLI (optional - writes the cards, hook and notifications)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code && claude --version
          else echo "no CLAUDE_CODE_OAUTH_TOKEN secret: cards are picked by keywords (see docs/claude-author.md)"; fi
      - name: Batch
        id: batch
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -m pipeline batch --mode "${{ github.event.inputs.mode || vars.VYBEX_MODE || 'auto' }}" --count "${{ github.event.inputs.count || vars.VYBEX_POSTS_PER_DAY || '3' }}" --date "$(date -u +%F)"
      - name: "Buffer - 3 posts a day into the TikTok queue (mode = input, else variable VYBEX_BUFFER, else now)"
        if: always()
        shell: bash   # bash -e -o pipefail: a failed rclone/python must stop the step, nothing is swallowed
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          VYBEX_BUFFER: ${{ github.event.inputs.buffer || vars.VYBEX_BUFFER || 'now' }}
          VYBEX_POSTS_PER_DAY: ${{ vars.VYBEX_POSTS_PER_DAY || '3' }}
          VYBEX_TIMEZONE: ${{ vars.VYBEX_TIMEZONE || 'Asia/Almaty' }}
        run: |
          D=$(date -u +%F)
          # state lives in Drive/state/buffer.json; "first run" is accepted only when the folder/file really is absent, a Drive error stops the step
          ROOT_LS=$(rclone lsf gd:)
          if echo "$ROOT_LS" | grep -qx 'state/' && rclone lsf gd:state | grep -qx 'buffer.json'; then
            rclone copyto gd:state/buffer.json out/buffer-state.json
          else
            echo "no buffer state yet (first run)"
          fi
          rc=0
          if [ -f out/$D/report.json ]; then python -m pipeline buffer publish out/$D --state out/buffer-state.json || rc=$?
          else echo "no report.json (the Batch step failed or did not run): nothing to send today"; fi
          # videos that Buffer has really SENT to TikTok are deleted from Drive (ready/<date>/ files, trash-bin, recoverable ~30 days); drafts and hand-posted ones stay
          if [ -f out/buffer-state.json ]; then python -m pipeline buffer drive-cleanup --state out/buffer-state.json | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?; fi
          if [ -f out/buffer-state.json ]; then rclone copyto out/buffer-state.json gd:state/buffer.json; fi   # saved even when something failed
          exit $rc
      - name: "Song ideas -> Drive/ideas.md (optional: a failure here must not fail the video job)"
        if: always()
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          { rclone lsf gd:audio; rclone lsf gd:done; } > out/have.txt
          python -m pipeline ideas --have-file out/have.txt -o out/ideas.md
          rclone copyto out/ideas.md gd:ideas.md
      - name: Push results to Drive and mark songs done
        if: always()
        run: |
          D=$(date -u +%F)
          [ -d out/$D/ready ] && rclone copy out/$D/ready gd:ready/$D
          [ -f out/$D/report.json ] && rclone copyto out/$D/report.json gd:ready/$D/report.json
          [ -f out/$D/report.json ] && jq -r '.songs[]|select(.stages.render=="ok")|.audio_name' out/$D/report.json | while read -r f; do
            [ -n "$f" ] && rclone moveto "gd:audio/$f" "gd:done/$f"
          done
          [ -f out/$D/report.json ] && jq -r '.songs[]|"- \(.song): cards=\(.stages.author // "n/a"), render=\(.stages.render // "n/a")"' out/$D/report.json >> "$GITHUB_STEP_SUMMARY"
          [ -f out/$D/report.json ] && python -m pipeline buffer summary out/$D >> "$GITHUB_STEP_SUMMARY"
          echo "Results: Drive/ready/$D." >> "$GITHUB_STEP_SUMMARY"
      - name: "Memory + cleanup: when Drive/audio has no songs left, remember what was processed, then empty done/ (scripts/drive_clean.sh)"
        if: always()
        run: bash scripts/drive_clean.sh
