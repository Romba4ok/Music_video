name: generate
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  verify-replacement:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RCLONE_CONFIG_GD_TYPE: alias
      RCLONE_CONFIG_GD_REMOTE: /tmp/replacement-check/drive
      VYBEX_OWNER_DECLARES_RIGHTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg rclone && pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-large-v3
      - name: Verify a real queue replacement after replaying the recorded rejection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, math, os, subprocess
          from pathlib import Path
          from pipeline import analyze, batch, download, fetch_songs
          from pipeline.audio_replacements import DriveReplacements
          from pipeline.common import load_config, parse_name

          def job_log(job):
              return subprocess.check_output(["gh", "api", "--allow-escape-sequences",
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/jobs/{job}/logs"]).decode("utf-8-sig")

          previous = job_log(137148945864)
          artist, title = "Jah Khalib", "Воу-воу палехчэ"
          assert f"{artist} — {title} | {{'fetch': 'ok', 'analyze': 'low_confidence'}}" in previous
          result = next(json.loads(line.split(" ", 1)[1]) for line in job_log(137202642742).splitlines()
                        if ' {"download_only":' in line and '"songs":' in line)
          root = Path("/tmp/replacement-check/work")
          cfg = load_config()
          account = root / "accounts/main"
          audio = root / cfg["audio_dir"]
          audio.mkdir(parents=True)
          drive = Path(os.environ["RCLONE_CONFIG_GD_REMOTE"])
          for folder in ("state", "done", "audio"):
              (drive / folder).mkdir(parents=True)
          (drive / "state/songs.md").write_text(fetch_songs.HEAD, encoding="utf-8")
          queue = [(artist, title)] + [parse_name(s["song"]) for s in result["songs"]]
          def filename(a,t):
              return f"{download._slug(a)} - {download._slug(t)}.mp3"
          (account / "queue.md").write_text("".join(f"{a} | {t} | | {filename(a,t)}\n" for a,t in queue), encoding="utf-8")
          marker = audio / filename(artist, title)
          batch.ROOT = root

          def fetch(e,cfg,mode):
              if e["audio_file"] == marker.name:
                  return marker, [{"source": "replay", "state": "ok"}]
              if not (audio / e["audio_file"]).is_file():
                  return None, []
              return batch.fetch_audio(e,cfg,mode)

          def recognize(path,hook,cfg):
              if path == marker:
                  print("Replaying the recorded low_confidence decision (original audio is not re-transcribed).", flush=True)
                  return {"fragment":{"low_ratio":math.nextafter(cfg["whisper"]["max_low_ratio"], 1)}}
              return analyze.analyze(path,hook,cfg)

          # Stop at the boundary before author/render/publication, after actual recognition and its normal gates.
          class Verified(BaseException): pass
          def finish(entry,analysis,spec,cfg):
              p = audio / entry["audio_file"]
              side = json.loads(Path(str(p)+".license.json").read_text())
              assert side["download_only"] and side["identity"] and side["sha256"]
              assert p.is_file() and (drive/"audio"/p.name).read_bytes() == p.read_bytes()
              assert (drive/"audio"/(p.name+".license.json")).is_file()
              assert fetch_songs.key(entry["artist"],entry["title"]) in fetch_songs.load_memory(drive/"state/songs.md")["done"]
              probe = subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration:stream=codec_name","-of","json",str(p)],text=True)
              print(json.dumps({"replacement":p.name,"site":side.get("source_site"),"bytes":p.stat().st_size,
                  "ffprobe":json.loads(probe),"low_ratio":analysis["fragment"]["low_ratio"],
                  "limit":cfg["whisper"]["max_low_ratio"]},ensure_ascii=False),flush=True)
              raise Verified()

          try:
              batch.run_batch("auto",1,"replay",cfg,root=root,replace_audio=DriveReplacements(root,cfg),
                  stages={"fetch":fetch,"check_audio":lambda p,n: (p,[]) if p == marker else download.check_audio(p,n),
                          "analyze":recognize,"author":finish})
          except Verified:
              print("Verified replacement before render; no posts created.", flush=True)
          else:
              raise RuntimeError("No replacement reached the normal recognition threshold")
          PY
