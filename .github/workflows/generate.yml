name: Read Buffer post statuses
on:
  workflow_dispatch:
    inputs:
      ids:
        description: Buffer post IDs separated by commas
        required: true
permissions: {}
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read status of the requested posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          POST_IDS: ${{ inputs.ids }}
        shell: python
        run: |
          import json, os, re
          from urllib.parse import urlsplit
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          ids=os.environ["POST_IDS"].split(",")
          assert 1 <= len(ids) <= 7 and all(re.fullmatch("[a-f0-9]{24}",i) for i in ids)
          for i in ids:
              query="query { post(input:{id:"+json.dumps(i)+"}) { id status sentAt externalLink error { message } } }"
              r=Request("https://api.buffer.com",data=json.dumps({"query":query}).encode(),
                        headers={"Content-Type":"application/json","Authorization":"Bearer "+os.environ["BUFFER_API_KEY"]})
              with build_opener(NoRedirect()).open(r,timeout=20) as resp: body=json.load(resp)
              if body.get("errors"):
                  print("GraphQL:",str(body["errors"][0].get("message",""))[:240])
                  raise SystemExit(1)
              post=body["data"]["post"]
              if not post:
                  print("POST STATUS",i,"not found")
                  continue
              link=urlsplit(post.get("externalLink") or "")
              public=link.scheme=="https" and link.hostname in {"www.tiktok.com","tiktok.com","vm.tiktok.com","vt.tiktok.com"} and not link.username
              error=re.sub(r'https?://\S+', '[link]',(post.get("error") or {}).get("message") or "")[:220]
              print("POST STATUS",json.dumps({"id":i,"status":post.get("status"),"sentAt":post.get("sentAt"),
                    "link":("https://"+link.hostname+link.path) if public else "", "error":error},ensure_ascii=False))
