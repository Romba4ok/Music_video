name: API credential check
on: workflow_dispatch
permissions: {}
jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        shell: python
        run: |
          import os, json, base64
          from urllib.parse import quote, urlencode
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          def call(url, data=None, headers=None):
              try:
                  with build_opener(NoRedirect()).open(Request(url, data=data, headers=headers or {}), timeout=25) as r:
                      print("HTTP", r.status, flush=True)
                      return json.load(r)
              except HTTPError as e:
                  raise SystemExit("HTTP " + str(e.code)) from None
              except Exception as e:
                  raise SystemExit(type(e).__name__) from None
          def env(k):
              if not os.getenv(k): raise SystemExit("Missing " + k)
              return os.environ[k]
          form = urlencode({"grant_type":"refresh_token","refresh_token":env("GDRIVE_REFRESH_TOKEN"),"client_id":env("GDRIVE_CLIENT_ID"),"client_secret":env("GDRIVE_CLIENT_SECRET")}).encode()
          token = call("https://oauth2.googleapis.com/token", form)["access_token"]
          folder = quote(env("GDRIVE_FOLDER_ID"), safe="")
          meta = call("https://www.googleapis.com/drive/v3/files/"+folder+"?fields=mimeType,trashed&supportsAllDrives=true", headers={"Authorization":"Bearer "+token})
          assert meta.get("mimeType") == "application/vnd.google-apps.folder" and meta.get("trashed") is False
          print("PASS: Drive folder accessible")
  buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        shell: python
        run: |
          import os, json, base64
          from urllib.parse import quote, urlencode
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          def call(url, data=None, headers=None):
              try:
                  with build_opener(NoRedirect()).open(Request(url, data=data, headers=headers or {}), timeout=25) as r:
                      print("HTTP", r.status, flush=True)
                      return json.load(r)
              except HTTPError as e:
                  raise SystemExit("HTTP " + str(e.code)) from None
              except Exception as e:
                  raise SystemExit(type(e).__name__) from None
          def env(k):
              if not os.getenv(k): raise SystemExit("Missing " + k)
              return os.environ[k]
          def query(q, variables):
              payload = json.dumps({"query":q,"variables":variables}).encode()
              response = call("https://api.buffer.com", payload, {"Authorization":"Bearer "+env("BUFFER_API_KEY"),"Content-Type":"application/json"})
              if response.get("errors"): raise SystemExit("GraphQL request rejected")
              return response["data"]
          orgs = query("query { account { organizations { id } } }", {})["account"]["organizations"]
          channels = [c for o in orgs for c in query("query($o: OrganizationId!) { channels(input:{organizationId:$o}) { service isDisconnected isLocked isQueuePaused } }", {"o":o["id"]})["channels"] if c.get("service","").lower()=="tiktok"]
          assert channels, "no TikTok channel"
          usable = sum(not c.get("isDisconnected") and not c.get("isLocked") for c in channels)
          print("TikTok channels:",len(channels),"connected and unlocked:",usable)
          assert usable, "channel disconnected or locked"
          print("PASS: Buffer account and TikTok channel accessible")
  cloudinary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check cloudinary
        env:
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        shell: python
        run: |
          import os, json, base64
          from urllib.parse import quote, urlencode
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          def call(url, data=None, headers=None):
              try:
                  with build_opener(NoRedirect()).open(Request(url, data=data, headers=headers or {}), timeout=25) as r:
                      print("HTTP", r.status, flush=True)
                      return json.load(r)
              except HTTPError as e:
                  raise SystemExit("HTTP " + str(e.code)) from None
              except Exception as e:
                  raise SystemExit(type(e).__name__) from None
          def env(k):
              if not os.getenv(k): raise SystemExit("Missing " + k)
              return os.environ[k]
          auth = base64.b64encode((env("CLOUDINARY_API_KEY")+":"+env("CLOUDINARY_API_SECRET")).encode()).decode()
          data = call("https://api.cloudinary.com/v1_1/"+quote(env("CLOUDINARY_CLOUD_NAME"),safe="")+"/ping", headers={"Authorization":"Basic "+auth})
          assert data.get("status") == "ok"
          print("PASS: authenticated Cloudinary ping")
  jamendo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check jamendo
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        shell: python
        run: |
          import os, json, base64
          from urllib.parse import quote, urlencode
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          def call(url, data=None, headers=None):
              try:
                  with build_opener(NoRedirect()).open(Request(url, data=data, headers=headers or {}), timeout=25) as r:
                      print("HTTP", r.status, flush=True)
                      return json.load(r)
              except HTTPError as e:
                  raise SystemExit("HTTP " + str(e.code)) from None
              except Exception as e:
                  raise SystemExit(type(e).__name__) from None
          def env(k):
              if not os.getenv(k): raise SystemExit("Missing " + k)
              return os.environ[k]
          data = call("https://api.jamendo.com/v3.0/tracks/?"+urlencode({"client_id":env("JAMENDO_CLIENT_ID"),"format":"json","limit":1,"search":"piano","audiodlformat":"mp32"}))
          head = data.get("headers",{})
          code = str(head.get("code",""))
          print("Jamendo application code:",code if code.isdecimal() else "unknown")
          assert head.get("status") == "success" and isinstance(data.get("results"),list), "Jamendo search rejected"
          print("PASS: authenticated search, tracks returned:",len(data["results"]))
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install project CLI
        run: npm install --global @anthropic-ai/claude-code --silent
      - name: Check claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -eu
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          cd "$RUNNER_TEMP"
          if printf '%s\n' 'Reply with just OK.' | timeout 90 claude -p --model sonnet --tools "" --output-format text --no-session-persistence > reply.txt 2> cli-error.txt && grep -Eiq '^[[:space:]]*OK[.!]?[[:space:]]*$' reply.txt; then
            echo "PASS: Sonnet answered the tools-disabled request"
          else
            if grep -Eiq 'rate limit|usage limit|quota|429' reply.txt cli-error.txt; then echo "FAIL: rate or usage limit"
            elif grep -Eiq 'unauth|expired|log in|login|401|invalid token' reply.txt cli-error.txt; then echo "FAIL: authentication"
            else echo "FAIL: no verified model reply"; fi
            exit 1
          fi
